name: Release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-utils
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-34' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build official WFF tools
        env:
          WATCHFACE_COMMIT: 44b1855d445686ac8de5dbc95003d6f8e6623643
        run: |
          git clone https://github.com/google/watchface.git "$RUNNER_TEMP/watchface"
          git -C "$RUNNER_TEMP/watchface" checkout "$WATCHFACE_COMMIT"
          (cd "$RUNNER_TEMP/watchface/third_party/wff" && ./gradlew --no-daemon :specification:validator:executable-jar)
          (cd "$RUNNER_TEMP/watchface/play-validations" && ./gradlew --no-daemon :memory-footprint:executable-jar)
          echo "WFF_VALIDATOR_JAR=$RUNNER_TEMP/watchface/third_party/wff/specification/validator/build/libs/wff-validator.jar" >> "$GITHUB_ENV"
          echo "WFF_MEMORY_JAR=$RUNNER_TEMP/watchface/play-validations/memory-footprint/build/libs/memory-footprint.jar" >> "$GITHUB_ENV"
      - name: Check release metadata and test
        run: |
          ./tools/check-release.sh "$GITHUB_REF_NAME"
          ./tools/test.sh
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/wearfaces-release.jks"
      - name: Build signed release APKs
        env:
          WEARFACES_KEYSTORE: ${{ runner.temp }}/wearfaces-release.jks
          WEARFACES_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          WEARFACES_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          WEARFACES_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease
      - name: Prepare release assets
        run: |
          version=${GITHUB_REF_NAME#v}
          mkdir -p release-assets
          while IFS= read -r apk; do
            face=$(cut -d/ -f2 <<<"$apk")
            cp "$apk" "release-assets/${face}-${version}.apk"
          done < <(find faces -path '*/build/outputs/apk/release/*.apk' -type f | sort)
          (cd release-assets && ../tools/checksums.sh ./*.apk > SHA256SUMS)
          test -s release-assets/SHA256SUMS
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: false
          fail_on_unmatched_files: true
