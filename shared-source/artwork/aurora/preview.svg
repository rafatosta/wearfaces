<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="450" height="450" viewBox="0 0 450 450" text-rendering="geometricPrecision">
  <title>Aurora preview</title>
  <desc>Default Aurora palette at 10:08 with illustrative complication values.</desc>
  <circle cx="225" cy="225" r="225" fill="#000000"/>

  <!-- Four concentric layers mirror the active-mode WFF halo. -->
  <circle cx="225" cy="225" r="155" fill="#67f5c8" opacity=".1255"/>
  <circle cx="225" cy="225" r="120" fill="#21d4a7" opacity=".2039"/>
  <circle cx="225" cy="225" r="82" fill="#9bffe8" opacity=".2980"/>
  <circle cx="225" cy="225" r="47" fill="#67f5c8" opacity=".4314"/>

  <g fill="#9bffe8" opacity=".8627">
    <rect x="221" y="28" width="8" height="34" rx="4"/>
    <rect x="388" y="221" width="34" height="8" rx="4"/>
    <rect x="221" y="388" width="8" height="34" rx="4"/>
    <rect x="28" y="221" width="34" height="8" rx="4"/>
  </g>

  <!-- Sample data demonstrates both configurable slots; providers remain user-selected. -->
  <g fill="none" stroke="#17483e" stroke-width="3" opacity=".3529">
    <circle cx="108" cy="224" r="49"/>
    <circle cx="342" cy="224" r="49"/>
  </g>
  <g fill="#9bffe8" font-family="DejaVu Sans, sans-serif" text-anchor="middle">
    <text x="108" y="232" font-size="24">72%</text>
    <text x="342" y="232" font-size="24">18°</text>
    <text x="225" y="348" font-size="26" font-weight="500" opacity=".9020">21 AUG</text>
  </g>

  <!-- Hands use the same source geometry, pivots and PREVIEW_TIME as watchface.xml. -->
  <g transform="rotate(-56 225 225)">
    <g transform="translate(215 75)">
      <path fill="#9bffe8" d="M10 4 17 112q0 10-7 18-7-8-7-18Z"/>
    </g>
  </g>
  <g transform="rotate(48 225 225)">
    <g transform="translate(218 37)">
      <path fill="#67f5c8" d="m7 2 5 152q0 10-5 19-5-9-5-19Z"/>
    </g>
  </g>
  <circle cx="225" cy="225" r="9" fill="#9bffe8"/>
  <circle cx="225" cy="225" r="3" fill="#000000"/>
</svg>
